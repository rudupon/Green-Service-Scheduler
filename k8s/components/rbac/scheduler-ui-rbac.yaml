apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-ui-account
  namespace: edge-computing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler-ui-role
  namespace: edge-computing
rules:
- apiGroups: [""]
  resources: ["configmaps", "pods"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler-ui-rolebinding
  namespace: edge-computing
subjects:
- kind: ServiceAccount
  name: scheduler-ui-account
  namespace: edge-computing
roleRef:
  kind: Role
  name: scheduler-ui-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scheduler-ui-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scheduler-ui-node-reader-binding
subjects:
- kind: ServiceAccount
  name: scheduler-ui-account
  namespace: edge-computing
roleRef:
  kind: ClusterRole
  name: scheduler-ui-node-reader
  apiGroup: rbac.authorization.k8s.io