apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-node-home
  namespace: edge-computing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-node
      location: home
  template:
    metadata:
      labels:
        app: edge-node
        location: home
    spec:
      nodeSelector:
        edge-location: home
      containers:
      - name: edge-collector
        image: nginx:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: energy-config
          mountPath: /etc/energy-config
      volumes:
      - name: energy-config
        configMap:
          name: home-energy-config
---
