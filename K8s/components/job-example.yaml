apiVersion: batch/v1
kind: Job
metadata:
  name: data-processing-task
  namespace: edge-computing
  labels:
    task-type: data-processing
    energy-requirement: "medium" # low, medium, high
    priority: "deferrable" # critical, normal, deferrable
  annotations:
    max-delay: "3600"
    min-green-energy: "0.7" # minimaal vereiste groene energie (0-1)
spec:
  nodeSelector:
    edge-location: home
  template:
    spec:
      schedulerName: green-scheduler
      containers:
      - name: processor
        image: task-image:latest
        env:
        - name: TASK_TYPE
          value: "data-processing"
        - name: ENERGY_REQUIREMENT
          value: "medium"
        - name: PRIORITY
          value: "deferrable"
        - name: TASK_DURATION
          value: "60"  # Duur in seconden
        - name: CPU_LOAD
          value: "70"  # Percentage CPU belasting
      restartPolicy: Never